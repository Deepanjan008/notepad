name: Test-Signed Release APK (Firebase Test Lab)

on:
  workflow_dispatch:

jobs:
  build-test-release-apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      # NOTE: Throwaway keystore for Firebase Test Lab / Robo tests ONLY.
      # Never use this for production or Play Store releases.
      - name: Generate temporary test keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/test-release.keystore" \
            -alias testkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10 \
            -storepass android \
            -keypass android \
            -dname "CN=DevTest, OU=DevStep, O=DevStep, L=City, ST=State, C=US"

      - name: Build signed release APK
        run: |
          ./gradlew assembleRelease --stacktrace \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/test-release.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=testkey \
            -Pandroid.injected.signing.key.password=android

      - uses: actions/upload-artifact@v7
        with:
          name: firebase-test-release-apk
          path: "**/build/outputs/apk/release/*.apk"
