name: Test-Signed Release APK (Firebase Test Lab)

on:
  workflow_dispatch:

jobs:
  build-test-release-apk:
    runs-on: ubuntu-latest

    env:
      NOTEPAD_STORE_PASSWORD: android
      NOTEPAD_KEY_ALIAS: testkey
      NOTEPAD_KEY_PASSWORD: android

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      # NOTE: Throwaway keystore for Firebase Test Lab / Robo tests ONLY.
      # Never use this for production or Play Store releases.
      - name: Generate temporary test keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/keystore.jks \
            -alias "$NOTEPAD_KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10 \
            -storepass "$NOTEPAD_STORE_PASSWORD" \
            -keypass "$NOTEPAD_KEY_PASSWORD" \
            -dname "CN=DevTest, OU=DevStep, O=DevStep, L=City, ST=State, C=US"

      - name: Build signed release APK
        run: ./gradlew assembleRelease --stacktrace

      - uses: actions/upload-artifact@v7
        with:
          name: firebase-test-release-apk
          path: "**/build/outputs/apk/release/*.apk"
